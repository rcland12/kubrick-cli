version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    # Kubrick is a published tool with ">=" ranges: only widen a range when a new release
    # falls outside it, never raise minimums (that breaks users' environments and 3.9).
    versioning-strategy: "increase-if-necessary"
    # PRs go through staging (CI + TestPyPI) like any other change.
    target-branch: "staging"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "rcland12"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/"
    # PRs go through staging (CI + TestPyPI) like any other change.
    target-branch: "staging"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    reviewers:
      - "rcland12"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    # PRs go through staging (CI + TestPyPI) like any other change.
    target-branch: "staging"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    reviewers:
      - "rcland12"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps"
