[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubrick-cli"
version = "0.2.0"
description = "Agentic coding CLI for local models (Ollama, vLLM, llama.cpp), Anthropic, OpenAI, Bedrock, and Triton"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Russell Land", email = "rcland12@gmail.com"}
]
dependencies = [
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.36",
    "cryptography>=42.0.0",
]

[project.urls]
Homepage = "https://github.com/rcland12/kubrick-cli"
Repository = "https://github.com/rcland12/kubrick-cli"
Issues = "https://github.com/rcland12/kubrick-cli/issues"

[project.scripts]
kubrick = "kubrick_cli.main:main"

[project.optional-dependencies]
bedrock = ["boto3>=1.34.0"]
keyring = ["keyring>=24.0.0"]
all = ["boto3>=1.34.0", "keyring>=24.0.0"]
dev = [
    "boto3>=1.34.0",
    "pytest>=7.0.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.10.0",
    "black>=22.0.0",
    "flake8>=6.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kubrick_cli*"]
exclude = ["tests*", "temp*", "unused*"]
